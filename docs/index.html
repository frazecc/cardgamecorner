<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardGameCorner</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .meta-line { font-size: 0.78rem; color: var(--muted); margin: 0 0 0.5rem; }
    .meta-line.stale { color: var(--warn-fg); background: var(--warn-bg); border-radius: 6px; padding: 0.25rem 0.5rem; }
    .toolbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .export-group { display: flex; gap: 0.35rem; }
    .notice { padding: 0.5rem 0.7rem; margin-bottom: 0.5rem; border-radius: 6px; font-size: 0.85rem;
              background: var(--warn-bg); color: var(--warn-fg); display: none; }
    .notice.show { display: block; }
  </style>
</head>
<body>
  <div class="topbar">
    <button type="button" class="icon-btn" id="btnSettings" title="Impostazioni">⚙️ Impostazioni</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <h3>Impostazioni</h3>
    <div class="settings-row">
      <label><input type="checkbox" id="optDark"> Tema scuro</label>
      <label>
        Righe per pagina
        <select id="optPageSize">
          <option value="25">25</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
        </select>
      </label>
    </div>
  </div>

  <p class="meta-line" id="metaLine">Caricamento dati...</p>
  <div class="notice" id="notice" role="status"></div>

  <section class="filters">
    <div class="field-row">
      <div class="field">
        <label for="name">Nome carta</label>
        <input id="name" type="text" placeholder="es. Charizard" />
      </div>
      <div class="field exp-field" id="expField">
        <label for="expSearch">Espansione</label>
        <input id="expSearch" type="text" placeholder="Tutte" autocomplete="off" aria-haspopup="listbox" aria-expanded="false" />
        <div class="exp-panel" id="expPanel" hidden>
          <div class="exp-actions">
            <button type="button" class="action secondary" id="expAll">Seleziona tutte</button>
            <button type="button" class="action secondary" id="expNone">Deseleziona tutte</button>
            <button type="button" class="action secondary" id="expOnly" hidden>Solo queste</button>
          </div>
          <div class="exp-list" id="expList" role="listbox" aria-multiselectable="true"></div>
        </div>
      </div>
      <div class="field">
        <label for="serial">Numero / Serial</label>
        <input id="serial" type="text" placeholder="es. 4/102" />
      </div>
      <div class="field">
        <label for="minCash">Cash min (€)</label>
        <input id="minCash" type="number" step="0.01" min="0" value="0.01" />
      </div>
      <div class="field">
        <label for="minBuono">Buono min (€)</label>
        <input id="minBuono" type="number" step="0.01" min="0" value="0.01" />
      </div>
      <div class="field">
        <label for="sort">Ordinamento</label>
        <select id="sort">
          <option value="buono_desc" selected>Buono ↓</option>
          <option value="buono_asc">Buono ↑</option>
          <option value="cash_desc">Cash ↓</option>
          <option value="cash_asc">Cash ↑</option>
          <option value="name_asc">Nome A-Z</option>
          <option value="name_desc">Nome Z-A</option>
          <option value="">Senza ordine</option>
          <optgroup label="Altri ordinamenti">
            <option value="diff_desc">Differenza Buono−Cash ↓</option>
            <option value="diff_asc">Differenza Buono−Cash ↑</option>
            <option value="ratio_desc">Rapporto Buono/Cash ↓</option>
            <option value="ratio_asc">Rapporto Buono/Cash ↑</option>
            <option value="exp_asc">Espansione A-Z</option>
          </optgroup>
        </select>
      </div>
      <div class="field adv-field">
        <button type="button" class="action secondary" id="advBtn" aria-expanded="false" aria-controls="advRow">Filtri avanzati <span class="badge" id="advCount" hidden>0</span></button>
      </div>
    </div>

    <div class="adv-row" id="advRow" hidden>
      <div class="field">
        <label for="maxCash">Cash max (€)</label>
        <input id="maxCash" type="number" step="0.01" min="0" placeholder="nessun limite" />
      </div>
      <div class="field">
        <label for="maxBuono">Buono max (€)</label>
        <input id="maxBuono" type="number" step="0.01" min="0" placeholder="nessun limite" />
      </div>
      <fieldset class="check-group">
        <legend>Foil</legend>
        <div id="foilList"></div>
      </fieldset>
      <fieldset class="check-group">
        <legend>1ª edizione</legend>
        <label><input type="checkbox" name="firstEdition" value="First Edition"> Sì</label>
        <label><input type="checkbox" name="firstEdition" value="__empty__"> No</label>
      </fieldset>
    </div>

    <div class="check-columns">
      <fieldset class="check-group">
        <legend>Lingua</legend>
        <div class="lang-split">
          <div id="langLeft"></div>
          <div id="langRight"></div>
        </div>
      </fieldset>

      <fieldset class="check-group">
        <legend>Condizione</legend>
        <div id="condList"></div>
      </fieldset>

      <fieldset class="check-group">
        <legend>Stato offerta</legend>
        <label><input type="checkbox" name="status" value="PREZZO DISPONIBILE" checked> Prezzo disponibile</label>
        <label><input type="checkbox" name="status" value="VALUTAZIONE SU RICHIESTA"> Valutazione su richiesta</label>
        <label><input type="checkbox" name="status" value="SENZA PREZZO BUYLIST"> Senza prezzo</label>
        <label><input type="checkbox" name="status" value="ESCLUSA DALLA BUYLIST"> Esclusa</label>
      </fieldset>
    </div>
  </section>

  <div class="toolbar">
    <span id="info">Caricamento...</span>
    <div class="toolbar-right">
      <div class="export-group">
        <button type="button" class="action secondary" id="btnXlsx" disabled title="Esporta tutte le pagine della ricerca attuale">Esporta Excel</button>
        <button type="button" class="action secondary" id="btnCsv" disabled title="Esporta tutte le pagine della ricerca attuale">Esporta CSV</button>
      </div>
      <div class="pagination">
        <button type="button" class="action secondary" id="prev" disabled>← Precedente</button>
        <span id="pageInfo">Pagina 1</span>
        <button type="button" class="action secondary" id="next" disabled>Successiva →</button>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <table id="dataTable">
      <thead>
        <tr>
          <th>Img</th>
          <th>Nome</th>
          <th>Espansione</th>
          <th>N°</th>
          <th>Lingua</th>
          <th>Condizione</th>
          <th>Foil</th>
          <th>1ª</th>
          <th class="num">Cash</th>
          <th class="num">Buono</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="dati-buylist.js"></script>
  <script src="filtri-buylist.js"></script>
  <script src="esporta-ricerca.js"></script>
  <script>
    var PAGE_SIZE = 50;
    var currentPage = 0;
    var debounceTimer = null;
    var searchId = 0;
    var meta = null;
    var caricati = {};          // gruppo -> righe già pronte
    var risultati = [];         // TUTTE le righe della ricerca attuale (ordinate): servono anche all'esportazione
    var ordineAttuale = 'buono_desc';

    function $(id) { return document.getElementById(id); }

    function checkedValues(name) {
      return Array.from(document.querySelectorAll('input[name="' + name + '"]:checked'))
        .map(function (el) { return el.value; });
    }

    function getFilters() {
      return {
        name: $('name').value.trim(),
        expansion: '',
        expansions: espFiltro(),
        serial: $('serial').value.trim(),
        languages: checkedValues('language'),
        conditions: checkedValues('condition'),
        foils: checkedValues('foil'),
        firstEditions: checkedValues('firstEdition'),
        statuses: checkedValues('status'),
        minCash: $('minCash').value,
        minBuono: $('minBuono').value,
        maxCash: $('maxCash').value,
        maxBuono: $('maxBuono').value,
        sort: $('sort').value
      };
    }

    /* ---------- tendina delle espansioni (scelta multipla, con ricerca scrivendo) ---------- */
    var espList = [];   // [{n: nome, c: {gruppo: carte}}] (comprese le espansioni senza carte)
    var espSel = {};    // nome -> true se selezionata; all'inizio sono tutte selezionate

    function espConta(e) {
      var t = 0;
      CGCFiltri.gruppiNecessari(checkedValues('status')).forEach(function (g) { t += (e.c && e.c[g]) || 0; });
      return t;
    }
    function espSelezionate() { return espList.filter(function (e) { return espSel[e.n]; }); }
    function espFiltro() {      // null = nessun filtro (tutte); altrimenti l'elenco dei nomi scelti
      if (!espList.length) return null;
      var scelte = espSelezionate();
      return scelte.length === espList.length ? null : scelte.map(function (e) { return e.n; });
    }
    function espVisibili() {
      var q = CGCFiltri.norm($('expSearch').value).trim();
      return espList.filter(function (e) { return !q || CGCFiltri.norm(e.n).indexOf(q) >= 0; });
    }
    function espRiassunto() {
      var n = espSelezionate().length;
      $('expSearch').placeholder = !espList.length ? 'Tutte' : n === espList.length ? 'Tutte (' + n + ')' :
        n === 0 ? 'Nessuna' : n === 1 ? espSelezionate()[0].n : n + ' selezionate';
    }
    function espRender() {
      var visibili = espVisibili();
      $('expOnly').hidden = !$('expSearch').value.trim();
      $('expList').innerHTML = visibili.length ? visibili.map(function (e) {
        var c = espConta(e);
        return '<label class="exp-item' + (c ? '' : ' vuota') + '" role="option"><input type="checkbox" data-n="' + escapeHtml(e.n) + '"' +
          (espSel[e.n] ? ' checked' : '') + '> <span class="exp-name">' + escapeHtml(e.n) + '</span><span class="exp-count">' + c + '</span></label>';
      }).join('') : '<div class="exp-vuoto">Nessuna espansione trovata</div>';
      espRiassunto();
    }
    function espApri(aperta) {
      $('expPanel').hidden = !aperta;
      $('expSearch').setAttribute('aria-expanded', aperta ? 'true' : 'false');
      if (!aperta && $('expSearch').value) { $('expSearch').value = ''; espRender(); }
    }
    function espImposta(visibili, valore, soloQueste) {
      if (soloQueste) espList.forEach(function (e) { espSel[e.n] = false; });
      visibili.forEach(function (e) { espSel[e.n] = valore; });
      espRender();
      search(true);
    }
    $('expSearch').addEventListener('focus', function () { espApri(true); });
    $('expSearch').addEventListener('click', function () { espApri(true); });
    $('expSearch').addEventListener('input', espRender);
    $('expList').addEventListener('change', function (ev) {
      var n = ev.target.getAttribute('data-n');
      if (n === null) return;
      espSel[n] = ev.target.checked;
      espRiassunto();
      search(true);
    });
    $('expAll').onclick = function () { espImposta(espVisibili(), true, false); };
    $('expNone').onclick = function () { espImposta(espVisibili(), false, false); };
    $('expOnly').onclick = function () { espImposta(espVisibili(), true, true); };
    document.addEventListener('click', function (ev) { if (!$('expField').contains(ev.target)) espApri(false); });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') espApri(false); });

    /* ---------- filtri avanzati (riga nascosta, con contatore) ---------- */
    function advAggiorna() {
      var n = ($('maxCash').value !== '' ? 1 : 0) + ($('maxBuono').value !== '' ? 1 : 0) +
        (checkedValues('firstEdition').length ? 1 : 0) + (checkedValues('foil').length ? 1 : 0);
      $('advCount').textContent = n;
      $('advCount').hidden = !n;
    }
    $('advBtn').onclick = function () {
      var apri = $('advRow').hidden;
      $('advRow').hidden = !apri;
      this.setAttribute('aria-expanded', apri ? 'true' : 'false');
    };
    $('advRow').addEventListener('input', advAggiorna);
    $('advRow').addEventListener('change', advAggiorna);

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* ---------- caricamento dati ---------- */
    function showNotice(testo) {
      var n = $('notice');
      n.textContent = testo || '';
      n.classList.toggle('show', !!testo);
    }

    function righeBase(gruppi) {
      var out = [];
      gruppi.forEach(function (g) { out = out.concat(caricati[g] || []); });
      return out;
    }

    async function assicuraDati(gruppi) {
      var mancanti = gruppi.filter(function (g) { return !caricati[g]; });
      if (!mancanti.length) return;
      var liste = await Promise.all(mancanti.map(function (g) { return CGCDati.carica([g]); }));
      mancanti.forEach(function (g, i) { caricati[g] = CGCFiltri.prepara(liste[i]); });
    }

    /* ---------- caselle dei filtri costruite dai dati ---------- */
    function casella(nome, o) {
      return '<label><input type="checkbox" name="' + nome + '" value="' + escapeHtml(o.valore) + '"> ' +
        escapeHtml(o.etichetta) + '</label>';
    }

    function valoriFiltri(campo) {
      var conteggi = {}, vf = (meta && meta.valori_filtri) || {};
      Object.keys(vf).forEach(function (g) {
        (vf[g][campo] || []).forEach(function (coppia) { conteggi[coppia[0]] = (conteggi[coppia[0]] || 0) + coppia[1]; });
      });
      return Object.keys(conteggi);
    }

    function costruisciFiltri() {
      var lingue = CGCFiltri.opzioniLingua(valoriFiltri('language'));
      $('langLeft').innerHTML = lingue.sinistra.map(function (o) { return casella('language', o); }).join('');
      $('langRight').innerHTML = lingue.destra.map(function (o) { return casella('language', o); }).join('');
      $('condList').innerHTML = CGCFiltri.opzioniCondizione(valoriFiltri('condition')).map(function (o) { return casella('condition', o); }).join('');
      $('foilList').innerHTML = CGCFiltri.opzioniFoil(valoriFiltri('foil')).map(function (o) { return casella('foil', o); }).join('');
      document.querySelectorAll('.filters input[type="checkbox"]').forEach(function (el) {
        el.addEventListener('change', function () { search(true); });
      });
      document.querySelectorAll('input[name="status"]').forEach(function (el) {
        el.addEventListener('change', espRender);   // i numeri accanto alle espansioni seguono lo stato scelto
      });
    }

    function mostraMeta() {
      var line = $('metaLine');
      if (!meta || !meta.generato_il) { line.textContent = ''; return; }
      var quando = new Date(meta.generato_il);
      var ore = (Date.now() - quando.getTime()) / 3600000;
      var testo = 'Dati aggiornati il ' + quando.toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' }) +
        ' (si aggiornano ogni ora)';
      if (meta.dati_controllati_dal) {
        line.title = 'Carte controllate sul sito dal ' + new Date(meta.dati_controllati_dal).toLocaleString('it-IT') +
          ' al ' + new Date(meta.dati_controllati_fino_al).toLocaleString('it-IT');
      }
      if (ore > 3) testo += ' · attenzione: l\u2019ultimo aggiornamento risale a circa ' + Math.round(ore) + ' ore fa';
      line.textContent = testo;
      line.classList.toggle('stale', ore > 3);
    }

    /* ---------- ricerca ---------- */
    async function search(resetPage) {
      if (resetPage === undefined) resetPage = true;
      if (resetPage) currentPage = 0;
      var myId = ++searchId;
      var filters = getFilters();
      var gruppi = CGCFiltri.gruppiNecessari(filters.statuses);
      var daCaricare = gruppi.some(function (g) { return !caricati[g]; });
      if (daCaricare) $('info').textContent = 'Caricamento dati...';
      try {
        await assicuraDati(gruppi);
      } catch (err) {
        if (myId !== searchId) return;
        $('info').textContent = 'Errore: impossibile leggere i dati (' + err.message + '). Riprova tra poco.';
        console.error(err);
        return;
      }
      if (myId !== searchId) return;
      ordineAttuale = filters.sort;
      risultati = CGCFiltri.ordina(CGCFiltri.filtra(righeBase(gruppi), filters), filters.sort);
      var pagine = Math.max(1, Math.ceil(risultati.length / PAGE_SIZE));
      if (currentPage >= pagine) currentPage = pagine - 1;
      renderPagina();
    }

    function scheduleSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function () { search(true); }, 400);
    }

    function renderPagina() {
      var inizio = currentPage * PAGE_SIZE;
      var righe = risultati.slice(inizio, inizio + PAGE_SIZE);
      renderTable(righe);
      updatePagination(righe.length);
    }

    function renderTable(rows) {
      var tbody = $('rows');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:1.5rem">Nessun risultato</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function (r) {
        var img = r.image && /^https?:\/\//i.test(r.image)
          ? '<img src="' + escapeHtml(r.image) + '" alt="" loading="lazy" class="thumb" onerror="this.style.display=\'none\'">'
          : '';
        return '<tr>' +
          '<td class="img-cell">' + img + '</td>' +
          '<td><strong>' + escapeHtml(r.name || '') + '</strong>' +
            (r.name_en && r.name_en !== r.name ? '<br><small>' + escapeHtml(r.name_en) + '</small>' : '') +
          '</td>' +
          '<td>' + escapeHtml(r.expansion || '') + '</td>' +
          '<td>' + escapeHtml(r.serial_number || '') + '</td>' +
          '<td>' + escapeHtml(r.language || '') + '</td>' +
          '<td>' + escapeHtml(r.condition || '') + '</td>' +
          '<td>' + escapeHtml(r.foil || '') + '</td>' +
          '<td>' + escapeHtml(r.first_edition || '') + '</td>' +
          '<td class="num">' + formatPrice(r.buylist) + '</td>' +
          '<td class="num">' + formatPrice(r.credit) + '</td>' +
          '<td><span class="status ' + statusClass(r.status) + '">' + escapeHtml(r.status || '') + '</span></td>' +
        '</tr>';
      }).join('');
    }

    function updatePagination(righeInPagina) {
      var totale = risultati.length;
      var totalPages = Math.max(1, Math.ceil(totale / PAGE_SIZE));
      var from = currentPage * PAGE_SIZE + (righeInPagina ? 1 : 0);
      var to = currentPage * PAGE_SIZE + righeInPagina;
      if (!totale) {
        $('info').textContent = 'Nessun risultato';
        $('pageInfo').textContent = 'Pagina 1';
      } else {
        $('info').textContent = 'Risultati ' + from + '–' + to + ' di ' + totale.toLocaleString('it-IT');
        $('pageInfo').textContent = 'Pagina ' + (currentPage + 1) + ' di ' + totalPages;
      }
      $('prev').disabled = currentPage === 0;
      $('next').disabled = currentPage + 1 >= totalPages;
      $('btnXlsx').disabled = $('btnCsv').disabled = !totale;
    }

    function formatPrice(v) {
      if (v == null || v === '') return '—';
      return Number(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusClass(s) {
      if (!s) return '';
      if (s.indexOf('DISPONIBILE') !== -1) return 'ok';
      if (s.indexOf('VALUTAZIONE') !== -1) return 'warn';
      if (s.indexOf('ESCLUSA') !== -1) return 'bad';
      return '';
    }

    /* ---------- esportazione: tutte le pagine della ricerca attuale ---------- */
    async function esporta(formato) {
      if (!risultati.length) return;
      var opzioni = {
        aggiornatoAl: meta && meta.generato_il ? new Date(meta.generato_il).toLocaleString('it-IT') : '',
        filtri: CGCFiltri.descrivi(getFilters()),
        ordinamento: CGCFiltri.ETICHETTE_ORDINE[ordineAttuale] || ''
      };
      try {
        var blob = formato === 'xlsx' ? await CGCEsporta.xlsx(risultati, opzioni) : CGCEsporta.csv(risultati, opzioni);
        CGCEsporta.scarica(blob, CGCEsporta.nomeFile(formato));
        showNotice('');
      } catch (err) {
        showNotice(err.message);
        console.error(err);
      }
    }

    /* ---------- impostazioni ---------- */
    function loadSettings() {
      try {
        var dark = localStorage.getItem('cgc_dark') === '1';
        var ps = localStorage.getItem('cgc_pagesize') || '50';
        $('optDark').checked = dark;
        $('optPageSize').value = ps;
        document.body.classList.toggle('dark', dark);
        PAGE_SIZE = parseInt(ps, 10) || 50;
      } catch (e) {}
    }

    function saveSettings() {
      try {
        localStorage.setItem('cgc_dark', $('optDark').checked ? '1' : '0');
        localStorage.setItem('cgc_pagesize', $('optPageSize').value);
      } catch (e) {}
    }

    $('btnSettings').onclick = function () { $('settingsPanel').classList.toggle('open'); };
    $('optDark').onchange = function () { document.body.classList.toggle('dark', this.checked); saveSettings(); };
    $('optPageSize').onchange = function () {
      PAGE_SIZE = parseInt(this.value, 10) || 50;
      saveSettings();
      currentPage = 0;
      renderPagina();
    };
    document.querySelectorAll('.filters input[type="text"], .filters input[type="number"]').forEach(function (el) {
      el.addEventListener('input', scheduleSearch);
    });
    $('sort').addEventListener('change', function () { search(true); });
    $('prev').onclick = function () { if (currentPage > 0) { currentPage--; renderPagina(); } };
    $('next').onclick = function () {
      if ((currentPage + 1) * PAGE_SIZE < risultati.length) { currentPage++; renderPagina(); }
    };
    $('btnXlsx').onclick = function () { esporta('xlsx'); };
    $('btnCsv').onclick = function () { esporta('csv'); };

    /* ---------- avvio ---------- */
    (async function avvia() {
      loadSettings();
      try {
        meta = await CGCDati.meta();
      } catch (err) {
        $('metaLine').textContent = '';
        $('info').textContent = 'Errore: impossibile leggere i dati (' + err.message + '). Riprova tra poco.';
        console.error(err);
        return;
      }
      mostraMeta();
      costruisciFiltri();
      espList = (meta && meta.espansioni) || [];
      espList.forEach(function (e) { espSel[e.n] = true; });
      espRender();
      search(true);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardGameCorner Buylist</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>CardGameCorner Buylist</h1>
    <p class="subtitle">Dati pubblici da Supabase · aggiornati automaticamente</p>
  </header>

  <section class="filters">
    <div class="filter-row">
      <input id="name" type="text" placeholder="Nome carta (es. Charizard)..." />
      <input id="expansion" type="text" placeholder="Espansione..." />
      <input id="serial" type="text" placeholder="Numero / Serial..." />
    </div>

    <div class="filter-row">
      <select id="language">
        <option value="">Tutte le lingue</option>
        <option value="Italiano">Italiano</option>
        <option value="English">English</option>
        <option value="German">German</option>
        <option value="French">French</option>
        <option value="Spanish">Spanish</option>
        <option value="Japanese">Japanese</option>
      </select>

      <select id="condition">
        <option value="">Tutte le condizioni</option>
        <option value="NM/M">NM/M (Near Mint / Mint)</option>
        <option value="SP">SP (Slightly Played)</option>
        <option value="HP">HP (Heavily Played)</option>
        <option value="D">D (Damaged)</option>
      </select>

      <select id="foil">
        <option value="">Foil / non foil</option>
        <option value="Reverse Holo">Reverse Holo</option>
      </select>

      <select id="status">
        <option value="">Tutti gli stati</option>
        <option value="PREZZO DISPONIBILE">Prezzo disponibile</option>
        <option value="VALUTAZIONE SU RICHIESTA">Valutazione su richiesta</option>
        <option value="SENZA PREZZO BUYLIST">Senza prezzo</option>
        <option value="ESCLUSA DALLA BUYLIST">Esclusa</option>
      </select>
    </div>

    <div class="filter-row">
      <input id="minBuylist" type="number" step="0.01" placeholder="Buylist min €" />
      <input id="maxBuylist" type="number" step="0.01" placeholder="Buylist max €" />
      <select id="sort">
        <option value="buylist_desc">Prezzo più alto (pagina)</option>
        <option value="buylist_asc">Prezzo più basso (pagina)</option>
        <option value="name_asc">Nome A-Z (pagina)</option>
        <option value="">Nessun ordinamento</option>
      </select>
      <button id="btnSearch">Cerca</button>
      <button id="btnReset" class="secondary">Reset</button>
    </div>
  </section>

  <div class="toolbar">
    <span id="info">Pronto — usa i filtri (consigliato partire da nome o prezzo minimo)</span>
    <div class="pagination">
      <button id="prev" disabled>← Precedente</button>
      <span id="pageInfo">Pagina 1</span>
      <button id="next" disabled>Successiva →</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Img</th>
          <th>Nome</th>
          <th>Espansione</th>
          <th>N°</th>
          <th>Lingua</th>
          <th>Condizione</th>
          <th>Foil</th>
          <th>1ª</th>
          <th class="num">Buylist</th>
          <th class="num">Credit</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <p>Dati provenienti dalla vista pubblica <code>cgc_buylist</code> · solo lettura</p>
  </footer>

  <script>
    // ========== CREDENZIALI (già inserite) ==========
    const SUPABASE_URL = 'https://tjdmspsbcvyvmvxvqjop.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qPV-hACz7ru0agM5aNW_XQ_d_CKbyER';
    // ===============================================

    const PAGE_SIZE = 50;
    let currentPage = 0;
    let hasMore = false;

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getFilters() {
      return {
        name: document.getElementById('name').value.trim(),
        expansion: document.getElementById('expansion').value.trim(),
        serial: document.getElementById('serial').value.trim(),
        language: document.getElementById('language').value,
        condition: document.getElementById('condition').value,
        foil: document.getElementById('foil').value,
        minBuylist: document.getElementById('minBuylist').value,
        maxBuylist: document.getElementById('maxBuylist').value,
        status: document.getElementById('status').value,
        sort: document.getElementById('sort').value
      };
    }

    function buildQuery(filters) {
      // MAI ordinare per buylist sul server → causa timeout
      let q = sb
        .from('cgc_buylist')
        .select(
          'name, name_en, expansion, serial_number, image, language, condition, foil, first_edition, buylist, credit, status'
        )
        .range(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE - 1);

      if (filters.name) q = q.ilike('name', '%' + filters.name + '%');
      if (filters.expansion) q = q.ilike('expansion', '%' + filters.expansion + '%');
      if (filters.serial) q = q.ilike('serial_number', '%' + filters.serial + '%');
      if (filters.language) q = q.eq('language', filters.language);
      if (filters.condition) q = q.eq('condition', filters.condition);
      if (filters.foil) q = q.eq('foil', filters.foil);
      if (filters.minBuylist) q = q.gte('buylist', filters.minBuylist);
      if (filters.maxBuylist) q = q.lte('buylist', filters.maxBuylist);
      if (filters.status) q = q.eq('status', filters.status);

      return q;
    }

    function sortClient(rows, sort) {
      if (!sort || !rows.length) return rows;
      const copy = rows.slice();
      if (sort === 'buylist_desc') {
        copy.sort(function(a, b) { return (Number(b.buylist) || 0) - (Number(a.buylist) || 0); });
      } else if (sort === 'buylist_asc') {
        copy.sort(function(a, b) { return (Number(a.buylist) || 0) - (Number(b.buylist) || 0); });
      } else if (sort === 'name_asc') {
        copy.sort(function(a, b) { return String(a.name || '').localeCompare(String(b.name || '')); });
      }
      return copy;
    }

    async function search(resetPage) {
      if (resetPage === undefined) resetPage = true;
      if (resetPage) currentPage = 0;

      const filters = getFilters();
      document.getElementById('info').textContent = 'Caricamento...';

      try {
        const { data, error } = await buildQuery(filters);

        if (error) {
          var msg = error.message || 'Errore sconosciuto';
          if (msg.indexOf('timeout') !== -1 || msg.indexOf('canceling') !== -1) {
            msg = 'Timeout: la ricerca è troppo ampia. Aggiungi un filtro più selettivo (nome o prezzo minimo).';
          }
          document.getElementById('info').textContent = 'Errore: ' + msg;
          console.error(error);
          return;
        }

        var rows = data || [];
        hasMore = rows.length === PAGE_SIZE;

        // Ordinamento solo sulla pagina corrente (client-side)
        rows = sortClient(rows, filters.sort);

        renderTable(rows);
        updatePagination(rows.length);
      } catch (err) {
        document.getElementById('info').textContent = 'Errore di rete: ' + err.message;
        console.error(err);
      }
    }

    function renderTable(rows) {
      var tbody = document.getElementById('rows');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:2rem">Nessun risultato con questi filtri</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(function(r) {
        var img = r.image
          ? '<img src="' + r.image + '" alt="" loading="lazy" class="thumb" onerror="this.style.display=\'none\'">'
          : '';
        return '<tr>' +
          '<td class="img-cell">' + img + '</td>' +
          '<td><strong>' + escapeHtml(r.name || '') + '</strong>' +
            (r.name_en && r.name_en !== r.name ? '<br><small>' + escapeHtml(r.name_en) + '</small>' : '') +
          '</td>' +
          '<td>' + escapeHtml(r.expansion || '') + '</td>' +
          '<td>' + escapeHtml(r.serial_number || '') + '</td>' +
          '<td>' + escapeHtml(r.language || '') + '</td>' +
          '<td>' + escapeHtml(r.condition || '') + '</td>' +
          '<td>' + escapeHtml(r.foil || '') + '</td>' +
          '<td>' + escapeHtml(r.first_edition || '') + '</td>' +
          '<td class="num">' + formatPrice(r.buylist) + '</td>' +
          '<td class="num">' + formatPrice(r.credit) + '</td>' +
          '<td><span class="status ' + statusClass(r.status) + '">' + escapeHtml(r.status || '') + '</span></td>' +
        '</tr>';
      }).join('');
    }

    function updatePagination(rowsOnPage) {
      var from = currentPage * PAGE_SIZE + 1;
      var to = currentPage * PAGE_SIZE + rowsOnPage;
      document.getElementById('info').textContent =
        rowsOnPage === 0
          ? 'Nessun risultato'
          : 'Mostrati ' + from + '–' + to + (hasMore ? ' (ci sono altri risultati)' : '');
      document.getElementById('pageInfo').textContent = 'Pagina ' + (currentPage + 1);
      document.getElementById('prev').disabled = currentPage === 0;
      document.getElementById('next').disabled = !hasMore;
    }

    function formatPrice(v) {
      if (v == null || v === '') return '—';
      return Number(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusClass(s) {
      if (!s) return '';
      if (s.indexOf('DISPONIBILE') !== -1) return 'ok';
      if (s.indexOf('VALUTAZIONE') !== -1) return 'warn';
      if (s.indexOf('ESCLUSA') !== -1) return 'bad';
      return '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('btnSearch').onclick = function() { search(true); };
    document.getElementById('btnReset').onclick = function() {
      document.querySelectorAll('.filters input, .filters select').forEach(function(el) {
        if (el.tagName === 'SELECT') el.selectedIndex = 0;
        else el.value = '';
      });
      search(true);
    };
    document.getElementById('prev').onclick = function() { currentPage--; search(false); };
    document.getElementById('next').onclick = function() { currentPage++; search(false); };

    document.querySelectorAll('.filters input').forEach(function(inp) {
      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') search(true); });
    });

    search(true);
  </script>
</body>
</html>

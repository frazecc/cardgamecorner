<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardGameCorner</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section class="filters">
    <div class="filter-row">
      <input id="name" type="text" placeholder="Nome carta..." />
      <input id="expansion" type="text" placeholder="Espansione..." />
      <input id="serial" type="text" placeholder="Numero / Serial..." />
      <input id="minCash" type="number" step="0.01" min="0" placeholder="Cash min €" value="0.01" />
      <input id="maxCash" type="number" step="0.01" min="0" placeholder="Cash max €" />
      <input id="minBuono" type="number" step="0.01" min="0" placeholder="Buono min €" value="0.01" />
      <input id="maxBuono" type="number" step="0.01" min="0" placeholder="Buono max €" />
      <select id="sort">
        <option value="buono_desc" selected>Buono ↓</option>
        <option value="buono_asc">Buono ↑</option>
        <option value="cash_desc">Cash ↓</option>
        <option value="cash_asc">Cash ↑</option>
        <option value="name_asc">Nome A-Z</option>
        <option value="">Senza ordine</option>
      </select>
      <button id="btnReset" class="secondary">Reset</button>
    </div>

    <div class="check-columns">
      <fieldset class="check-group">
        <legend>Lingua</legend>
        <label><input type="checkbox" name="language" value="Italiano"> Italiano</label>
        <label><input type="checkbox" name="language" value="English"> English</label>
        <label><input type="checkbox" name="language" value="Japanese"> Japanese</label>
        <label><input type="checkbox" name="language" value="German"> German</label>
        <label><input type="checkbox" name="language" value="French"> French</label>
        <label><input type="checkbox" name="language" value="Spanish"> Spanish</label>
        <label><input type="checkbox" name="language" value="Portuguese"> Portuguese</label>
        <label><input type="checkbox" name="language" value="Korean"> Korean</label>
        <label><input type="checkbox" name="language" value="Chinese"> Chinese</label>
        <label><input type="checkbox" name="language" value="Chinese Simplified"> Chinese Simplified</label>
        <label><input type="checkbox" name="language" value="Chinese Traditional"> Chinese Traditional</label>
      </fieldset>

      <fieldset class="check-group">
        <legend>Condizione</legend>
        <label><input type="checkbox" name="condition" value="NM/M"> NM/M</label>
        <label><input type="checkbox" name="condition" value="SP"> SP</label>
        <label><input type="checkbox" name="condition" value="HP"> HP</label>
        <label><input type="checkbox" name="condition" value="D"> D</label>
      </fieldset>

      <fieldset class="check-group">
        <legend>Foil</legend>
        <label><input type="checkbox" name="foil" value="Reverse Holo"> Reverse Holo</label>
        <label><input type="checkbox" name="foil" value="Holo"> Holo</label>
        <label><input type="checkbox" name="foil" value="Yes"> Yes</label>
        <label><input type="checkbox" name="foil" value="No"> No</label>
      </fieldset>

      <fieldset class="check-group">
        <legend>Stato offerta</legend>
        <label><input type="checkbox" name="status" value="PREZZO DISPONIBILE" checked> Prezzo disponibile</label>
        <label><input type="checkbox" name="status" value="VALUTAZIONE SU RICHIESTA"> Valutazione su richiesta</label>
        <label><input type="checkbox" name="status" value="SENZA PREZZO BUYLIST"> Senza prezzo</label>
        <label><input type="checkbox" name="status" value="ESCLUSA DALLA BUYLIST"> Esclusa</label>
      </fieldset>
    </div>
  </section>

  <div class="toolbar">
    <span id="info">Caricamento...</span>
    <div class="pagination">
      <button id="prev" disabled>← Precedente</button>
      <span id="pageInfo">Pagina 1</span>
      <button id="next" disabled>Successiva →</button>
    </div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Img</th>
          <th>Nome</th>
          <th>Espansione</th>
          <th>N°</th>
          <th>Lingua</th>
          <th>Condizione</th>
          <th>Foil</th>
          <th>1ª</th>
          <th class="num">Cash</th>
          <th class="num">Buono</th>
          <th>Stato</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = 'https://tjdmspsbcvyvmvxvqjop.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qPV-hACz7ru0agM5aNW_XQ_d_CKbyER';
    const PAGE_SIZE = 50;

    let currentPage = 0;
    let hasMore = false;
    let lastRowsCount = 0;
    let knownTotal = null;
    let debounceTimer = null;
    let searchId = 0;

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function checkedValues(name) {
      return Array.from(document.querySelectorAll('input[name="' + name + '"]:checked'))
        .map(function(el) { return el.value; });
    }

    function getFilters() {
      return {
        name: document.getElementById('name').value.trim(),
        expansion: document.getElementById('expansion').value.trim(),
        serial: document.getElementById('serial').value.trim(),
        languages: checkedValues('language'),
        conditions: checkedValues('condition'),
        foils: checkedValues('foil'),
        statuses: checkedValues('status'),
        minCash: document.getElementById('minCash').value,
        maxCash: document.getElementById('maxCash').value,
        minBuono: document.getElementById('minBuono').value,
        maxBuono: document.getElementById('maxBuono').value,
        sort: document.getElementById('sort').value
      };
    }

    function buildQuery(filters) {
      var q = sb
        .from('cgc_buylist')
        .select(
          'name, name_en, expansion, serial_number, image, language, condition, foil, first_edition, buylist, credit, status'
        )
        .range(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE - 1);

      if (filters.name) q = q.ilike('name', '%' + filters.name + '%');
      if (filters.expansion) q = q.ilike('expansion', '%' + filters.expansion + '%');
      if (filters.serial) q = q.ilike('serial_number', '%' + filters.serial + '%');

      if (filters.languages.length === 1) q = q.eq('language', filters.languages[0]);
      else if (filters.languages.length > 1) q = q.in('language', filters.languages);

      if (filters.conditions.length === 1) q = q.eq('condition', filters.conditions[0]);
      else if (filters.conditions.length > 1) q = q.in('condition', filters.conditions);

      if (filters.foils.length === 1) q = q.eq('foil', filters.foils[0]);
      else if (filters.foils.length > 1) q = q.in('foil', filters.foils);

      if (filters.statuses.length === 1) q = q.eq('status', filters.statuses[0]);
      else if (filters.statuses.length > 1) q = q.in('status', filters.statuses);

      if (filters.minCash) q = q.gte('buylist', filters.minCash);
      if (filters.maxCash) q = q.lte('buylist', filters.maxCash);
      if (filters.minBuono) q = q.gte('credit', filters.minBuono);
      if (filters.maxBuono) q = q.lte('credit', filters.maxBuono);

      return q;
    }

    function sortClient(rows, sort) {
      if (!sort || !rows.length) return rows;
      var copy = rows.slice();
      if (sort === 'cash_desc') {
        copy.sort(function(a, b) { return (Number(b.buylist) || 0) - (Number(a.buylist) || 0); });
      } else if (sort === 'cash_asc') {
        copy.sort(function(a, b) { return (Number(a.buylist) || 0) - (Number(b.buylist) || 0); });
      } else if (sort === 'buono_desc') {
        copy.sort(function(a, b) { return (Number(b.credit) || 0) - (Number(a.credit) || 0); });
      } else if (sort === 'buono_asc') {
        copy.sort(function(a, b) { return (Number(a.credit) || 0) - (Number(b.credit) || 0); });
      } else if (sort === 'name_asc') {
        copy.sort(function(a, b) {
          return String(a.name || '').localeCompare(String(b.name || ''), 'it', { sensitivity: 'base' });
        });
      }
      return copy;
    }

    function applyDefaults() {
      document.getElementById('name').value = '';
      document.getElementById('expansion').value = '';
      document.getElementById('serial').value = '';
      document.getElementById('minCash').value = '0.01';
      document.getElementById('maxCash').value = '';
      document.getElementById('minBuono').value = '0.01';
      document.getElementById('maxBuono').value = '';
      document.getElementById('sort').value = 'buono_desc';

      document.querySelectorAll('.filters input[type="checkbox"]').forEach(function(el) {
        el.checked = false;
      });
      var prezzo = document.querySelector('input[name="status"][value="PREZZO DISPONIBILE"]');
      if (prezzo) prezzo.checked = true;
    }

    async function search(resetPage) {
      if (resetPage === undefined) resetPage = true;
      if (resetPage) {
        currentPage = 0;
        knownTotal = null;
      }

      var myId = ++searchId;
      var filters = getFilters();
      document.getElementById('info').textContent = 'Caricamento...';

      try {
        var result = await buildQuery(filters);
        if (myId !== searchId) return;

        if (result.error) {
          var msg = result.error.message || 'Errore sconosciuto';
          if (msg.indexOf('timeout') !== -1 || msg.indexOf('canceling') !== -1) {
            msg = 'Timeout: restringi la ricerca (nome o valori minimi).';
          }
          document.getElementById('info').textContent = 'Errore: ' + msg;
          console.error(result.error);
          return;
        }

        var rows = result.data || [];
        lastRowsCount = rows.length;
        hasMore = rows.length === PAGE_SIZE;
        if (!hasMore) knownTotal = currentPage * PAGE_SIZE + rows.length;

        rows = sortClient(rows, filters.sort);
        renderTable(rows);
        updatePagination();
      } catch (err) {
        if (myId !== searchId) return;
        document.getElementById('info').textContent = 'Errore di rete: ' + err.message;
        console.error(err);
      }
    }

    function scheduleSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(function() { search(true); }, 350);
    }

    function renderTable(rows) {
      var tbody = document.getElementById('rows');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:2rem">Nessun risultato</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function(r) {
        var img = r.image
          ? '<img src="' + r.image + '" alt="" loading="lazy" class="thumb" onerror="this.style.display=\'none\'">'
          : '';
        return '<tr>' +
          '<td class="img-cell">' + img + '</td>' +
          '<td><strong>' + escapeHtml(r.name || '') + '</strong>' +
            (r.name_en && r.name_en !== r.name ? '<br><small>' + escapeHtml(r.name_en) + '</small>' : '') +
          '</td>' +
          '<td>' + escapeHtml(r.expansion || '') + '</td>' +
          '<td>' + escapeHtml(r.serial_number || '') + '</td>' +
          '<td>' + escapeHtml(r.language || '') + '</td>' +
          '<td>' + escapeHtml(r.condition || '') + '</td>' +
          '<td>' + escapeHtml(r.foil || '') + '</td>' +
          '<td>' + escapeHtml(r.first_edition || '') + '</td>' +
          '<td class="num">' + formatPrice(r.buylist) + '</td>' +
          '<td class="num">' + formatPrice(r.credit) + '</td>' +
          '<td><span class="status ' + statusClass(r.status) + '">' + escapeHtml(r.status || '') + '</span></td>' +
        '</tr>';
      }).join('');
    }

    function updatePagination() {
      var pageNum = currentPage + 1;
      var from = currentPage * PAGE_SIZE + (lastRowsCount ? 1 : 0);
      var to = currentPage * PAGE_SIZE + lastRowsCount;
      var infoText, pageText;

      if (lastRowsCount === 0) {
        infoText = 'Nessun risultato';
        pageText = 'Pagina 1';
      } else if (knownTotal !== null) {
        var totalPages = Math.max(1, Math.ceil(knownTotal / PAGE_SIZE));
        infoText = 'Risultati ' + from + '–' + to + ' di ' + knownTotal.toLocaleString('it-IT');
        pageText = 'Pagina ' + pageNum + ' di ' + totalPages;
      } else {
        infoText = 'Risultati ' + from + '–' + to + ' · almeno ' + to;
        pageText = 'Pagina ' + pageNum + ' · altre pagine disponibili';
      }

      document.getElementById('info').textContent = infoText;
      document.getElementById('pageInfo').textContent = pageText;
      document.getElementById('prev').disabled = currentPage === 0;
      document.getElementById('next').disabled = !hasMore;
    }

    function formatPrice(v) {
      if (v == null || v === '') return '—';
      return Number(v).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusClass(s) {
      if (!s) return '';
      if (s.indexOf('DISPONIBILE') !== -1) return 'ok';
      if (s.indexOf('VALUTAZIONE') !== -1) return 'warn';
      if (s.indexOf('ESCLUSA') !== -1) return 'bad';
      return '';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.querySelectorAll('.filters input[type="text"], .filters input[type="number"]').forEach(function(el) {
      el.addEventListener('input', scheduleSearch);
    });
    document.querySelectorAll('.filters input[type="checkbox"]').forEach(function(el) {
      el.addEventListener('change', function() { search(true); });
    });
    document.getElementById('sort').addEventListener('change', function() { search(true); });

    document.getElementById('btnReset').onclick = function() {
      applyDefaults();
      search(true);
    };

    document.getElementById('prev').onclick = function() {
      if (currentPage > 0) { currentPage--; search(false); }
    };
    document.getElementById('next').onclick = function() {
      if (hasMore) { currentPage++; search(false); }
    };

    // Default già impostati nell'HTML; avvio ricerca
    search(true);
  </script>
</body>
</html>

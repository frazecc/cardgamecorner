name: Buylist CardGameCorner in Supabase

# L'avvio automatico lunedi e giovedi e DISATTIVATO: ora i dati li aggiorna lo
# scanner continuo (supabase_continuo.yml). Questo workflow resta disponibile solo
# a mano, come copia di sicurezza con scansione completa.
on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Importa un checkpoint completo gia raccolto, senza nuovo scraping'
        type: boolean
        default: false
      source_run_id:
        description: 'Con publish_only: run contenente il checkpoint completo'
        type: string
        default: '43749325476'

permissions:
  contents: read
  actions: read

concurrency:
  group: cardgamecorner-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt
      - name: Verifica codice e configurazione
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo 'Crea la variabile GitHub SUPABASE_URL (Settings > Secrets and variables > Actions > Variables).'
            exit 1
          fi
          python -m unittest discover -s tests -q
          python -c 'import os; from supabase_sync import SupabaseClient; SupabaseClient(os.environ["SUPABASE_URL"], os.environ.get("SUPABASE_SERVICE_ROLE_KEY", ""))'
          if [[ "$PUBLISH_ONLY" == 'true' && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'Indica il run contenente il checkpoint completo.'
            exit 1
          fi
      - name: Recupera checkpoint completo
        if: inputs.publish_only
        uses: actions/download-artifact@v4
        with:
          name: Buylist-Pokemon-Diagnostica
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: dati
      - name: Normalizza percorso checkpoint
        if: inputs.publish_only
        run: python -c 'import shutil; shutil.copyfile("dati/CardGameCorner_Buylist_Pokemon_Completa.checkpoint.jsonl", "CardGameCorner_Buylist_Pokemon_Completa.checkpoint.jsonl")'
      - name: Installa Chromium
        if: ${{ !inputs.publish_only }}
        run: python -m playwright install --with-deps chromium
      - name: Raccogli una nuova buylist
        if: ${{ !inputs.publish_only }}
        run: python -u scraper.py 2>&1 | tee scrape.log
      - name: Importa e verifica Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -o pipefail
          # Fino a 3 tentativi sullo stesso checkpoint (l'import e idempotente): niente interventi manuali
          # se Supabase e lento o momentaneamente irraggiungibile.
          ARGS=()
          if [[ "$PUBLISH_ONLY" == 'true' ]]; then ARGS=(--source-run-id "$SOURCE_RUN_ID"); fi
          for attempt in 1 2 3; do
            if python -u supabase_sync.py "${ARGS[@]}" 2>&1 | tee -a supabase.log; then exit 0; fi
            echo "Tentativo $attempt di 3 non riuscito."
            if [[ "$attempt" -lt 3 ]]; then sleep 180; fi
          done
          exit 1
      - name: Conserva checkpoint e risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buylist-Pokemon-Diagnostica
          path: |
            *.xlsx
            *.checkpoint.jsonl
            *.log
          retention-days: 30
          if-no-files-found: warn
